spring:
  application:
    name: secp256k1-llm-experiment
  config:
    # Optional local .env (KEY=value lines, git-ignored). A real environment variable takes precedence.
    import: optional:file:.env[.properties]
  main:
    # Console application: never start a web server, even if web libraries are on the classpath
    web-application-type: none
    banner-mode: off
    log-startup-info: false
  http:
    client:
      connect-timeout: 10s
      read-timeout: 180s
  ai:
    # Only the chat model is needed; disable everything else the OpenAI starter brings
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # OpenRouter is OpenAI-compatible. Spring AI appends /v1/chat/completions itself,
      # so the base URL ends with /api (not /api/v1).
      base-url: https://openrouter.ai/api
      # Key comes ONLY from the OPENROUTER_API_KEY environment variable or the git-ignored .env file.
      # Never put a real key in this file.
      api-key: ${OPENROUTER_API_KEY:}
    retry:
      # Fail fast: a failed call is recorded as ERROR instead of retrying for minutes
      max-attempts: 2
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s

experiment:
  # Exact model IDs: https://openrouter.ai/models
  models:
    - meta-llama/llama-3.3-70b-instruct   # open-source, used in production on the blog
    - anthropic/claude-haiku-5.5          # Anthropic, small and cheap
    - deepseek/deepseek-v4.1-flash        # reasoning model (fast and cheap; deepseek-r1 often exceeded the timeout)
    - openai/gpt-6-luna                   # small and cheap, for contrast
  runs-per-prompt: 3
  temperature: 0.7
  # Upper bound per answer, keeps the cost of a full run low.
  # Reasoning models spend part of it on hidden reasoning; an empty answer
  # with finish_reason=length means the limit was too small.
  max-tokens: 2048
  # Cap on hidden reasoning per model (OpenRouter "reasoning.max_tokens"), must be < max-tokens.
  # Without it deepseek-v4.1-flash spent all 2048 tokens thinking and returned an empty answer.
  # Model IDs contain "/" and ".", so keys must be written in brackets.
  reasoning-max-tokens:
    "[deepseek/deepseek-v4.1-flash]": 1024
  results-dir: results

# Experiment "weak-entropy": --experiment=weak-entropy (no OpenRouter key needed)
weak-entropy:
  scenarios:
    - SECONDS_DAY      # seed = Unix seconds, attacker knows the day (86 400 candidates)
    - MILLIS_HOUR      # seed = Unix millis, attacker knows the hour (3 600 000 candidates)
    - SEED_32BIT       # 2^32 keys (Milk Sad): not enumerated, only extrapolated
    - SECURE_RANDOM    # reference: ~2^128, see the recovery experiment
  seconds-window: 86400
  millis-window: 3600000
  warmup-candidates: 20000
  benchmark-candidates: 100000
  extrapolation:
    # Assumptions for "how long to search all 2^32 on N GPUs". Shown next to the result.
    gpu-count: 100
    candidates-per-second-per-gpu: 1e9

# Experiment "llm-review": --experiment=llm-review (needs OpenRouter key)
llm-review:
  runs-per-prompt: 3
  # Reasoning models spend tokens on hidden reasoning; with only 2048 some REVIEW answers came
  # back empty (finish_reason=LENGTH). Give the reasoning models more room; claude-haiku writes
  # long reviews and was truncated at 2048, so raise it too.
  model-max-tokens:
    "[deepseek/deepseek-v4.1-flash]": 8192
    "[openai/gpt-6-luna]": 8192
    "[anthropic/claude-haiku-5.5]": 4096

estimator:
  # Deliberately generous assumptions in favour of the attacker.
  # Order of magnitude of all GPUs in the world (gaming, data center, mobile excluded).
  gpu-count: 1e9
  # Elliptic curve group operations per second on one modern GPU
  # (fast Pollard rho / kangaroo implementations reach a few 10^9 on top consumer cards).
  ops-per-second-per-gpu: 1e10

logging:
  level:
    root: WARN
    com.example.secp256k1llmexperiment: INFO
    # Spring AI logs every failed attempt with a full stack trace; LlmRecoveryClient logs one line instead
    org.springframework.ai.retry: ERROR
